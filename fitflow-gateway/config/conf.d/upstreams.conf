# FitFlow Gateway - Upstream Server Definitions

# FitFlow Admin API upstream
upstream fitflow_admin_api {
    server localhost:9081;
    keepalive 32;
}

# FitFlow Business Service upstream
upstream fitflow_business {
    server localhost:8092;
    keepalive 32;
}

# IAM Service upstream
upstream iam_service {
    server localhost:8091;
    keepalive 32;
}

